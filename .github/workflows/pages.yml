name: Publier CyberWatch sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publication:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Charger le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4


