name: Collecter les alertes et publier CyberWatch

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publication:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
      - name: Préparer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Récupérer les alertes officielles CERT-FR
        run: python scripts/fetch_cert_alerts.py --output alerts.json
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Charger le site et le flux actualisé
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
